# This file contains the configuration settings for your Redwood app.
# This file is also what makes your Redwood app a Redwood app.
# If you remove it and try to run `yarn rw dev`, you'll get an error.
#
# For the full list of options, see the "App Configuration: redwood.toml" doc:
# https://redwoodjs.com/docs/app-configuration-redwood-toml

[web]
  bundler = "vite"
  # bundler = "webpack"
  title = "spoonjoy"
  port = 8910
  host = "local.spoonjoy.app"
  # host = '0.0.0.0' # Bind to all network instances/allow access from anywhere
  apiUrl = "/.redwood/functions"
  # apiUrl = "/.redwood/functions"
  includeEnvironmentVariables = ["FE_URL", "RWJS_API_URL", "GOOGLE_CLIENT_ID", "APPLE_CLIENT_ID", "GITHUB_CLIENT_ID"] # any ENV vars that should be available to the web side, see https://redwoodjs.com/docs/environment-variables#web
[api]
  port = 8911
[browser]
  open = true
